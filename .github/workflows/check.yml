name: Check

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7 # the version the team builds with (Dart 3.13.5)
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Errors fail the check; warnings and style hints are listed but do not.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Data check
        run: python3 plugins/daleel/scripts/check_data.py

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7 # the version the team builds with (Dart 3.13.5)
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
